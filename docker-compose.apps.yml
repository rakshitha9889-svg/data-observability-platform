services:
  incident-api:
    networks:
      - observability_network
    build:
      context: .
      dockerfile: docker/api.Dockerfile

    image: data-observability-incident-api:local

    environment:
      DATABASE_URL: postgresql+psycopg2://commerce_user:commerce_password@postgres:5432/commerce

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped

  observability-dashboard:
    networks:
      - observability_network
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile

    image: data-observability-dashboard:local

    environment:
      DATABASE_URL: postgresql+psycopg2://commerce_user:commerce_password@postgres:5432/commerce
      ASSISTANT_API_URL: http://incident-api:8000

    ports:
      - "8501:8501"

    depends_on:
      postgres:
        condition: service_healthy

      incident-api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped

