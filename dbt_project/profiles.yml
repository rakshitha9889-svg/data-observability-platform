data_observability:
  target: development

  outputs:
    development:
      type: postgres

      host: "{{ env_var('DBT_POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_POSTGRES_USER', 'commerce_user') }}"
      password: "{{ env_var('DBT_POSTGRES_PASSWORD', 'change_me') }}"
      dbname: "{{ env_var('DBT_POSTGRES_DB', 'commerce') }}"

      schema: analytics
      threads: 4
      connect_timeout: 10