name: Data Observability CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Formatting and linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Check Ruff formatting
        run: |
          ruff format --check assistant tests

      - name: Run Ruff linting
        run: |
          ruff check assistant tests

  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg2://commerce_user:commerce_password@localhost:5432/commerce

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: commerce
          POSTGRES_USER: commerce_user
          POSTGRES_PASSWORD: commerce_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd
          "pg_isready -U commerce_user -d commerce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Initialize project database
        env:
          PGPASSWORD: commerce_password
        run: |
          for sql_file in database/init/*.sql; do
            echo "Applying ${sql_file}"
            psql \
              -h localhost \
              -U commerce_user \
              -d commerce \
              -v ON_ERROR_STOP=1 \
              -f "${sql_file}"
          done

      - name: Run unit and integration tests
        run: |
          python -m pytest \
            tests/unit \
            tests/integration \
            --cov=assistant \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error


  docker-build:
    name: Build application images
    runs-on: ubuntu-latest
    needs:
      - quality
      - tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build incident API image
        run: |
          docker build \
            -f docker/api.Dockerfile \
            -t data-observability-incident-api:ci \
            .

      - name: Build dashboard image
        run: |
          docker build \
            -f docker/dashboard.Dockerfile \
            -t data-observability-dashboard:ci \
            .

      - name: Verify incident API image command
        run: |
          docker image inspect \
            data-observability-incident-api:ci \
            --format '{{json .Config.Cmd}}'

      - name: Verify dashboard image command
        run: |
          docker image inspect \
            data-observability-dashboard:ci \
            --format '{{json .Config.Cmd}}'